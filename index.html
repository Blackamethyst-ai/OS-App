  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metaventions AI V1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
    <style>
       :root {
          /* --- SOVEREIGN BRAND VECTORS // ZENITH SYNC --- */
          --amethyst: #7B2CFF;
          --cyan: #18E6FF;
          --executive-gold: #f1c21b;
          --obsidian: #020204;
          --plasma-green: #10b981;
          
          /* --- OPTICAL DEPTH SYSTEM --- */
          --bg-app: var(--obsidian);
          --bg-header: rgba(2, 2, 4, 0.85);
          --bg-panel: rgba(255, 255, 255, 0.015);
          --border-main: rgba(255, 255, 255, 0.06);
          --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
       }

       body { 
          font-family: 'Inter', sans-serif; 
          background-color: var(--bg-app); 
          color: white; 
          margin: 0; 
          padding: 0; 
          -webkit-font-smoothing: antialiased;
          overflow: hidden;
       }

       .font-mono { font-family: 'Fira Code', monospace; }
       
       /* --- CRYSTALLINE REFRACTION ARCHITECTURE --- */
       .crystalline {
          background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%) !important;
          backdrop-filter: blur(40px) saturate(180%) !important;
          -webkit-backdrop-filter: blur(40px) saturate(180%) !important;
          border: 1px solid rgba(255, 255, 255, 0.08);
          box-shadow: 
            inset 0 0 40px rgba(123, 44, 255, 0.05),
            0 20px 80px -20px rgba(0, 0, 0, 0.8);
       }

       .glass-refraction {
          position: relative;
          overflow: hidden;
       }
       .glass-refraction::before {
          content: "";
          position: absolute;
          inset: 0;
          background: linear-gradient(105deg, transparent 40%, rgba(24, 230, 255, 0.05) 45%, rgba(24, 230, 255, 0.1) 50%, rgba(24, 230, 255, 0.05) 55%, transparent 60%);
          background-size: 200% 200%;
          animation: refraction-sweep 8s infinite linear;
          pointer-events: none;
          z-index: 1;
       }

       @keyframes refraction-sweep {
          0% { background-position: -200% -200%; }
          100% { background-position: 200% 200%; }
       }

       .invisible-glass {
          background: rgba(255, 255, 255, 0.003) !important;
          backdrop-filter: blur(25px) saturate(140%) !important;
          border: 1px solid rgba(255, 255, 255, 0.05);
       }

       .custom-scrollbar::-webkit-scrollbar { width: 3px; height: 3px; }
       .custom-scrollbar::-webkit-scrollbar-thumb {
          background: linear-gradient(to bottom, var(--amethyst), var(--cyan));
          border-radius: 10px;
       }
       
       .shimmer-text {
          background: linear-gradient(90deg, #fff, var(--cyan), #fff);
          background-size: 200% auto;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: shimmer 4s linear infinite;
       }

       @keyframes shimmer {
          to { background-position: 200% center; }
       }
    </style>
