<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metaventions AI V1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
    <style>
       :root {
          /* --- SOVEREIGN TWO-TONE PALETTE --- */
          --azure-blue: #3b82f6;
          --amethyst: #7B2CFF;
          --cyan: #18E6FF;
          --void-black: #020204;
          --stellar-white: #FFFFFF;

          /* --- REFINED GLASS MAPPING --- */
          --bg-app: var(--void-black);
          --bg-header: rgba(5, 5, 10, 0.4);
          --bg-panel: rgba(255, 255, 255, 0.03);
          --bg-card: rgba(255, 255, 255, 0.02);
          --text-primary: var(--stellar-white);
          --text-secondary: #94A3B8;
          --text-muted: #64748b;
          --border-main: rgba(255, 255, 255, 0.08);
          --logo-glow: rgba(123, 44, 255, 0.5);
       }

       body { 
          font-family: 'Inter', sans-serif; 
          background-color: var(--bg-app); 
          color: var(--text-primary); 
          margin: 0; 
          padding: 0; 
          transition: background-color 1s ease, color 0.5s ease;
          -webkit-font-smoothing: antialiased;
          overflow: hidden;
       }

       .font-mono { font-family: 'Fira Code', monospace; }
       
       /* THE TRUE CRYSTALLINE FEATURE: High-Index Flint Glass */
       .crystalline {
          background: rgba(255, 255, 255, 0.035);
          backdrop-filter: blur(45px) saturate(240%);
          -webkit-backdrop-filter: blur(45px) saturate(240%);
          border: 1px solid rgba(255, 255, 255, 0.12);
          box-shadow: 
            inset 0 1px 1px rgba(255, 255, 255, 0.1),
            0 25px 50px -12px rgba(0, 0, 0, 0.7);
       }

       /* TRANSPARENT GLASS ACTION BUTTONS */
       .glass-action {
          background: rgba(255, 255, 255, 0.05);
          backdrop-filter: blur(20px) saturate(180%);
          border: 1px solid rgba(255, 255, 255, 0.2);
          box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.05);
          transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
       }
       .glass-action:hover {
          background: rgba(255, 255, 255, 0.12);
          border-color: rgba(255, 255, 255, 0.4);
          transform: translateY(-1px);
       }

       /* SPECULAR SHIMMER */
       .shimmer-edge::after {
          content: "";
          position: absolute;
          top: -50%;
          left: -50%;
          width: 200%;
          height: 200%;
          background: linear-gradient(
            45deg,
            transparent 45%,
            rgba(255, 255, 255, 0.08) 48%,
            rgba(255, 255, 255, 0.15) 50%,
            rgba(255, 255, 255, 0.08) 52%,
            transparent 55%
          );
          animation: shimmer 12s infinite linear;
          pointer-events: none;
       }

       @keyframes shimmer {
          0% { transform: translateX(-40%) translateY(-40%); }
          100% { transform: translateX(40%) translateY(40%); }
       }

       .custom-scrollbar::-webkit-scrollbar {
          width: 4px;
          height: 4px;
       }
       .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
       .custom-scrollbar::-webkit-scrollbar-thumb {
          background: rgba(255, 255, 255, 0.1);
          border-radius: 10px;
       }
       .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: var(--cyan); }

       .no-scrollbar::-webkit-scrollbar { display: none; }
       .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
