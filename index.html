<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metaventions AI V1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@xyflow/react/dist/style.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
    <style>
       :root {
          /* --- SOVEREIGN TWO-TONE PALETTE --- */
          --azure-blue: #3b82f6;
          --amethyst: #7B2CFF;
          --cyan: #18E6FF;
          --void-black: #030305;
          --stellar-white: #FFFFFF;

          /* --- SEMANTIC MAPPING --- */
          --bg-app: var(--void-black);
          --bg-header: rgba(3, 3, 5, 0.98);
          --bg-panel: rgba(10, 10, 15, 0.95);
          --bg-card: rgba(15, 15, 20, 0.8);
          --text-primary: var(--stellar-white);
          --text-secondary: #94A3B8;
          --text-muted: #475569;
          --border-main: rgba(24, 230, 255, 0.15);
          --logo-glow: rgba(123, 44, 255, 0.5);
       }

       body { 
          font-family: 'Inter', sans-serif; 
          background-color: var(--bg-app); 
          color: var(--text-primary); 
          margin: 0; 
          padding: 0; 
          transition: background-color 1s ease, color 0.5s ease;
          -webkit-font-smoothing: antialiased;
          overflow: hidden;
       }

       .font-mono { font-family: 'Fira Code', monospace; }
       
       /* LEGIBILITY SHIELD */
       .text-shield {
          text-shadow: 0 0 30px rgba(0,0,0,0.9), 0 0 10px rgba(0,0,0,0.5);
       }

       /* SPECTRAL TEXT */
       .text-glow-spectrum {
          background: linear-gradient(135deg, var(--amethyst), var(--cyan));
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          filter: drop-shadow(0 0 15px rgba(24, 230, 255, 0.4));
       }

       .glass-card {
          background: var(--bg-card);
          backdrop-filter: blur(32px) saturate(180%);
          border: 1px solid var(--border-main);
          box-shadow: inset 0 0 40px rgba(24, 230, 255, 0.05), 0 20px 50px rgba(0,0,0,0.5);
       }

       /* BRAND INNER GLOW */
       .brand-inner-glow {
          box-shadow: inset 0 0 60px rgba(123, 44, 255, 0.1), inset 0 0 20px rgba(24, 230, 255, 0.1);
       }

       .custom-scrollbar::-webkit-scrollbar {
          width: 5px;
          height: 5px;
       }
       .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
       .custom-scrollbar::-webkit-scrollbar-thumb {
          background: var(--border-main);
          border-radius: 10px;
       }
       .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: var(--cyan); }

       @keyframes slow-drift {
          0% { transform: translate(0, 0); }
          50% { transform: translate(-2%, -2%); }
          100% { transform: translate(0, 0); }
       }
       .animate-drift { animation: slow-drift 20s ease-in-out infinite; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",

    "idb": "https://esm.sh/idb@8.0.3",
    "jszip": "https://esm.sh/jszip@3.10.1",
    "html-to-image": "https://esm.sh/html-to-image@1.11.13?external=react,react-dom",
    "redux": "https://esm.sh/redux@4.2.1",
    "path": "https://esm.sh/path@^0.12.7",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "mermaid": "https://esm.sh/mermaid@^11.12.2",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "clsx": "https://esm.sh/clsx@^2.1.1",
